<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#60a5fa"/></marker>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:38px;font-weight:800;fill:#f9fafb}.sub{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#cbd5e1}.box{fill:#1f2937;stroke:#334155;stroke-width:2;rx:16;filter:url(#shadow)}.box2{fill:#111827;stroke:#3b82f6;stroke-width:2;rx:16;filter:url(#shadow)}.accent{fill:url(#blue)}.danger{fill:url(#red)}.h{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.p{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#dbeafe}.small{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#cbd5e1}.line{stroke:#60a5fa;stroke-width:3;fill:none;marker-end:url(#arrow)}.line2{stroke:#fb7185;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-dasharray:8 7}.badge{fill:#0b1220;stroke:#475569;stroke-width:1;rx:12}.num{font-family:Segoe UI,Arial,sans-serif;font-size:17px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1344" height="844" rx="24" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.8"/>
  <text x="60" y="78" class="title">Adatmodell diagram</text>
  <text x="60" y="112" class="sub">A fő Firestore kollekciók és üzleti kapcsolataik</text>
  
<rect x="80" y="165" width="280" height="150" rx="16" class="box2"/>
<text x="102" y="201" class="h">products</text><text x="102" y="233" class="p">id / sku / name</text><text x="102" y="257" class="p">category / price / stock</text><text x="102" y="281" class="p">images / featured / sale</text>
<rect x="560" y="165" width="280" height="150" rx="16" class="box2"/>
<text x="582" y="201" class="h">orders</text><text x="582" y="233" class="p">customer adatok</text><text x="582" y="257" class="p">items[] / totals</text><text x="582" y="281" class="p">status / invoiceNumber</text>
<rect x="1010" y="165" width="280" height="150" rx="16" class="box"/>
<text x="1032" y="201" class="h">users</text><text x="1032" y="233" class="p">uid / email / role</text><text x="1032" y="257" class="p">disabled / profile</text><text x="1032" y="281" class="p">shipping / billing</text>
<rect x="80" y="500" width="280" height="150" rx="16" class="box"/>
<text x="102" y="536" class="h">savedCustomers</text><text x="102" y="568" class="p">name / email / phone</text><text x="102" y="592" class="p">company / taxNumber</text><text x="102" y="616" class="p">blocked / totalSpent</text>
<rect x="560" y="500" width="280" height="150" rx="16" class="box"/>
<text x="582" y="536" class="h">coupons</text><text x="582" y="568" class="p">code / type / value</text><text x="582" y="592" class="p">active / limits</text><text x="582" y="616" class="p">validFrom / validTo</text>
<rect x="1010" y="500" width="280" height="150" rx="16" class="box"/>
<text x="1032" y="536" class="h">orderStatusAudit</text><text x="1032" y="568" class="p">orderId / from / to</text><text x="1032" y="592" class="p">changedBy / date</text><text x="1032" y="616" class="p">reason</text>
<path d="M360,240 C460,240 460,240 560,240" class="line"/><text x="397" y="225" class="small">order.items.productId</text>
<path d="M840,240 C925,240 925,240 1010,240" class="line"/><text x="865" y="225" class="small">customerId / userId</text>
<path d="M220,500 C420,500 420,315 620,315" class="line"/><text x="300" y="418" class="small">helyszíni vásárlás</text>
<path d="M700,500 C700,500 700,315 700,315" class="line"/><text x="720" y="410" class="small">couponCode</text>
<path d="M840,575 C925,575 925,575 1010,575" class="line"/><text x="880" y="560" class="small">status változás</text>

</svg>