<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .head { fill: #0f172a; }
      .headText { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .cellA { fill: #ffffff; }
      .cellB { fill: #eef6ff; }
      .cellC { fill: #fff5f5; }
      .text { font: 400 18px Arial, sans-serif; fill: #111827; }
      .bold { font: 700 18px Arial, sans-serif; fill: #111827; }
      .small { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .blue { fill: #2563eb; }
      .red { fill: #dc2626; }
      .line { stroke: #d1d5db; stroke-width: 1; }
      .border { fill: none; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860"/>

  <text x="70" y="70" class="title">Piaci összehasonlítás</text>
  <text x="70" y="102" class="subtitle">A vizsgált épületgépészeti webshopok és a TDLWebshop főbb funkcionális különbségei</text>

  <rect x="70" y="145" width="1260" height="610" rx="14" class="cellA"/>
  <rect x="70" y="145" width="1260" height="610" rx="14" class="border"/>

  <rect x="70" y="145" width="280" height="70" rx="14" class="head"/>
  <rect x="350" y="145" width="470" height="70" class="head"/>
  <rect x="820" y="145" width="510" height="70" rx="14" class="head"/>
  <text x="95" y="188" class="headText">Szempont</text>
  <text x="375" y="188" class="headText">Vizsgált webshopok jellemzői</text>
  <text x="845" y="188" class="headText">TDLWebshop megoldása</text>

  <g>
    <rect x="70" y="215" width="280" height="90" class="cellA"/>
    <rect x="350" y="215" width="470" height="90" class="cellA"/>
    <rect x="820" y="215" width="510" height="90" class="cellB"/>
    <text x="95" y="250" class="bold">Termékek elérése</text>
    <text x="375" y="247" class="text">Kategóriák és kereső jellemzően</text>
    <text x="375" y="272" class="text">megtalálhatók, minőségük változó.</text>
    <text x="845" y="247" class="text">Kategória, kereső, akciós és új</text>
    <text x="845" y="272" class="text">termékek külön kezelve.</text>
  </g>

  <g>
    <rect x="70" y="305" width="280" height="90" class="cellA"/>
    <rect x="350" y="305" width="470" height="90" class="cellA"/>
    <rect x="820" y="305" width="510" height="90" class="cellB"/>
    <text x="95" y="340" class="bold">Vásárlói folyamat</text>
    <text x="375" y="337" class="text">Kosár és checkout több oldalon</text>
    <text x="375" y="362" class="text">elérhető, eltérő részletességgel.</text>
    <text x="845" y="337" class="text">Kosár, checkout, profil és</text>
    <text x="845" y="362" class="text">rendelésállapot-követés egyben.</text>
  </g>

  <g>
    <rect x="70" y="395" width="280" height="90" class="cellA"/>
    <rect x="350" y="395" width="470" height="90" class="cellA"/>
    <rect x="820" y="395" width="510" height="90" class="cellB"/>
    <text x="95" y="430" class="bold">Adminisztráció</text>
    <text x="375" y="427" class="text">Külső felhasználóként nem látható,</text>
    <text x="375" y="452" class="text">csak feltételezhető.</text>
    <text x="845" y="427" class="text">Termék-, rendelés-, készlet-,</text>
    <text x="845" y="452" class="text">felhasználó- és CSV-kezelés.</text>
  </g>

  <g>
    <rect x="70" y="485" width="280" height="90" class="cellA"/>
    <rect x="350" y="485" width="470" height="90" class="cellA"/>
    <rect x="820" y="485" width="510" height="90" class="cellB"/>
    <text x="95" y="520" class="bold">Domain-specifikus</text>
    <text x="95" y="545" class="bold">működés</text>
    <text x="375" y="517" class="text">Általános webshop-folyamatok,</text>
    <text x="375" y="542" class="text">kevesebb látható B2B funkcióval.</text>
    <text x="845" y="517" class="text">Helyszíni vásárlás, mentett vásárlók,</text>
    <text x="845" y="542" class="text">PDF bizonylat és készletfigyelés.</text>
  </g>

  <g>
    <rect x="70" y="575" width="280" height="90" class="cellA"/>
    <rect x="350" y="575" width="470" height="90" class="cellA"/>
    <rect x="820" y="575" width="510" height="90" class="cellB"/>
    <text x="95" y="610" class="bold">Felhasználói élmény</text>
    <text x="375" y="607" class="text">Jó és közepes megoldások vegyesen,</text>
    <text x="375" y="632" class="text">eltérő mobilos minőséggel.</text>
    <text x="845" y="607" class="text">Dark/light mód, modern felület,</text>
    <text x="845" y="632" class="text">reszponzív webshopnézetek.</text>
  </g>

  <g>
    <rect x="70" y="665" width="280" height="90" class="cellA"/>
    <rect x="350" y="665" width="470" height="90" class="cellA"/>
    <rect x="820" y="665" width="510" height="90" class="cellC"/>
    <text x="95" y="700" class="bold">Többletérték</text>
    <text x="375" y="697" class="text">A vizsgált oldalak főleg klasszikus</text>
    <text x="375" y="722" class="text">webshop-funkciókra épülnek.</text>
    <text x="845" y="697" class="text">AI asszisztens és szakdolgozati</text>
    <text x="845" y="722" class="text">szinten dokumentált mérnöki háttér.</text>
  </g>

  <line x1="350" y1="145" x2="350" y2="755" class="line"/>
  <line x1="820" y1="145" x2="820" y2="755" class="line"/>
  <line x1="70" y1="215" x2="1330" y2="215" class="line"/>
  <line x1="70" y1="305" x2="1330" y2="305" class="line"/>
  <line x1="70" y1="395" x2="1330" y2="395" class="line"/>
  <line x1="70" y1="485" x2="1330" y2="485" class="line"/>
  <line x1="70" y1="575" x2="1330" y2="575" class="line"/>
  <line x1="70" y1="665" x2="1330" y2="665" class="line"/>

  <circle cx="1180" cy="88" r="13" class="blue"/>
  <circle cx="1210" cy="88" r="13" class="red"/>
  <text x="70" y="805" class="small">Forrás: saját piackutatási táblázatok alapján készített összefoglaló.</text>
</svg>
