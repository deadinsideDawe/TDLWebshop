<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="TDLWebshop komponens-architektura Firebase es OpenRouter integracioval">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .group-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 14px Arial, sans-serif; fill: #475569; }
      .label { font: 700 13px Arial, sans-serif; fill: #1e40af; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="24" y="24" width="1552" height="852" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="56" y="76" class="title">TDLWebshop komponens-architektura Firebase es OpenRouter integracioval</text>
  <line x1="56" y1="98" x2="1544" y2="98" stroke="url(#header-grad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Group backgrounds -->
  <rect x="70" y="145" width="440" height="610" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="100" y="185" class="group-title">Kliens oldali reteg</text>

  <rect x="580" y="145" width="490" height="610" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
  <text x="610" y="185" class="group-title">Firebase es adatvedelmi reteg</text>

  <rect x="1140" y="145" width="390" height="610" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="1170" y="185" class="group-title">AI integracios reteg</text>

  <!-- Client boxes -->
  <rect x="115" y="230" width="350" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="140" y="260" class="box-title">Felhasznaloi bongeszo</text>
  <text x="140" y="288" class="box-text">Vasarloi, dolgozoi es admin felulet</text>

  <rect x="115" y="370" width="350" height="105" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="140" y="400" class="box-title">Angular frontend</text>
  <text x="140" y="428" class="box-text">Komponensalapu SPA, route-ok, theme</text>
  <text x="140" y="448" class="box-text">valtasa, validaciok es UI allapotok</text>

  <rect x="115" y="525" width="350" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="140" y="555" class="box-title">Angular service reteg</text>
  <text x="140" y="583" class="box-text">AuthService, ProductService, CartService,</text>
  <text x="140" y="603" class="box-text">OrderService, InvoiceService, ChatbotLlmService</text>

  <!-- Firebase boxes -->
  <rect x="630" y="225" width="390" height="88" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="655" y="255" class="box-title">Firebase Hosting</text>
  <text x="655" y="283" class="box-text">A publikus Angular alkalmazas kiszolgalasa</text>

  <rect x="630" y="350" width="390" height="88" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="655" y="380" class="box-title">Firebase Authentication</text>
  <text x="655" y="408" class="box-text">Bejelentkezes, token es felhasznaloazonositas</text>

  <rect x="630" y="475" width="390" height="100" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="655" y="505" class="box-title">Firestore Rules</text>
  <text x="655" y="533" class="box-text">Admin, dolgozo, vasarlo es tiltott felhasznalo</text>
  <text x="655" y="553" class="box-text">ellenorzese minden fontos muveletnel</text>

  <rect x="630" y="620" width="390" height="96" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="655" y="650" class="box-title">Cloud Firestore</text>
  <text x="655" y="678" class="box-text">products, orders, users, coupons, savedCustomers,</text>
  <text x="655" y="698" class="box-text">wishlist, newsletter es audit adatok</text>

  <!-- AI boxes -->
  <rect x="1190" y="250" width="290" height="105" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1215" y="280" class="box-title">Cloudflare Worker proxy</text>
  <text x="1215" y="308" class="box-text">Szerveroldali atjaro az AI hivasokhoz</text>
  <text x="1215" y="328" class="box-text">CORS es alap kereskorlatozas</text>

  <rect x="1190" y="420" width="290" height="90" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1215" y="450" class="box-title">Worker secret</text>
  <text x="1215" y="478" class="box-text">OPENROUTER_API_KEY nem kerul</text>
  <text x="1215" y="498" class="box-text">a publikus frontend kodba</text>

  <rect x="1190" y="580" width="290" height="105" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1215" y="610" class="box-title">OpenRouter API</text>
  <text x="1215" y="638" class="box-text">LLM valaszadas a katalogushoz es</text>
  <text x="1215" y="658" class="box-text">epuletgepeszeti temakorhoz kotve</text>

  <!-- Arrows client -->
  <line x1="290" y1="322" x2="290" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="305" y="350" class="label">oldal betoltese</text>

  <line x1="290" y1="475" x2="290" y2="525" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="305" y="505" class="label">service hivasok</text>

  <!-- Hosting to angular -->
  <path d="M630 269 C555 269, 540 405, 465 418" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="500" y="315" class="label">statikus app</text>

  <!-- Services to firebase -->
  <path d="M465 565 C555 565, 545 394, 630 394" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="508" y="448" class="label">Auth</text>

  <path d="M465 595 C555 595, 545 525, 630 525" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="502" y="548" class="label" fill="#dc2626">jogosultsag</text>

  <line x1="825" y1="575" x2="825" y2="620" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="842" y="603" class="label">engedelyezett adatmuvelet</text>

  <!-- Services to AI -->
  <path d="M465 610 C725 805, 1040 765, 1190 632" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="720" y="790" class="label" fill="#ea580c">AI kerdes es katalogus kontextus</text>

  <line x1="1335" y1="355" x2="1335" y2="420" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="1352" y="392" class="label" fill="#ea580c">titkos kulcs</text>

  <line x1="1335" y1="510" x2="1335" y2="580" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="1352" y="550" class="label" fill="#ea580c">API hivas</text>

  <path d="M1190 632 C1040 785, 720 825, 465 625" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="8 6"/>
  <text x="735" y="838" class="small">szurt, felhasznalonak megjelenitheto valasz</text>

  <!-- Notes -->
  <rect x="70" y="792" width="1460" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="96" y="825" class="small">Megjegyzes: a frontend nem tarol OpenRouter kulcsot. Az adatbazis muveletek Firestore Rules ellenorzesen mennek keresztul, az AI hivasokat pedig a Cloudflare Worker valasztja el a publikus klienskodtol.</text>
</svg>
