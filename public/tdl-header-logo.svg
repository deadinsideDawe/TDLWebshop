<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-label="TDL Webshop">
  <defs>
    <linearGradient id="tdlBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb6ff"/>
      <stop offset="0.48" stop-color="#0d7ed2"/>
      <stop offset="1" stop-color="#063a74"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="0.32" stop-color="#c9ced4"/>
      <stop offset="0.68" stop-color="#707984"/>
      <stop offset="1" stop-color="#eef2f5"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f969e"/>
      <stop offset="0.45" stop-color="#11161c"/>
      <stop offset="1" stop-color="#d8dde2"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb14a"/>
      <stop offset="0.48" stop-color="#ff4a1f"/>
      <stop offset="1" stop-color="#b80f12"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe3ff"/>
      <stop offset="0.56" stop-color="#0c8edf"/>
      <stop offset="1" stop-color="#024977"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

