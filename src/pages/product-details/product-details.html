<!-- Termék adatlap: galéria + részletes leírás + kosár gomb. -->
<div class="page-container product-details-page">
  <a routerLink="/products" class="back-link">&lt; Vissza a termékekhez</a>

  <div class="card loading-card" *ngIf="loading">Termék betöltése...</div>
  <div class="card error-card" *ngIf="!loading && error">{{ error }}</div>

  <section class="card details-shell" *ngIf="!loading && product as item">
    <div class="gallery">
      <img class="main-image" [src]="selectedImage || item.image" [alt]="item.name">
      <div class="thumb-row">
        <button
          type="button"
          class="thumb-btn"
          *ngFor="let image of item.images"
          [class.active]="(selectedImage || item.image) === image"
          (click)="selectImage(image)"
        >
          <img [src]="image" [alt]="item.name">
        </button>
      </div>
    </div>

    <div class="content">
      <p class="category">{{ item.category }}</p>
      <h1>{{ item.name }}</h1>
      <p class="price">{{ item.price }} Ft</p>
      <p class="stock">Készlet: {{ item.stock }} ({{ item.stockQuantity }} db)</p>
      <p class="desc">{{ item.description }}</p>

      <div class="specs">
        <div class="spec-item">
          <span>Cikkszám</span>
          <strong>{{ item.sku }}</strong>
        </div>
        <div class="spec-item">
          <span>Márka</span>
          <strong>{{ item.brand }}</strong>
        </div>
      </div>

      <button class="btn btn-secondary" type="button" [disabled]="!canAddToCart" (click)="addToCart()">
        {{ canAddToCart ? 'Kosárba' : 'Nincs készleten' }}
      </button>
      <button class="btn wishlist-btn" type="button" (click)="toggleWishlist()">
        {{ isWishlisted ? 'Eltávolítás a kívánságlistából' : 'Kívánságlistára teszem' }}
      </button>
      <p class="stock-note" *ngIf="!canAddToCart">Ez a termék jelenleg nem rendelhető.</p>
    </div>
  </section>
</div>
